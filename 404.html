<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 智能车手记</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/assets/style.css">
<script>
  (function () {
    try {
      var s = localStorage.getItem('theme');
      var t = s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<main class="wrap" style="padding:100px 22px;text-align:center">
  <p style="font-size:56px;margin:0;line-height:1">⊘</p>
  <h1 style="margin:16px 0 8px;font-size:26px">这个页面不存在</h1>
  <p style="color:var(--text-soft)">可能链接打错了，也可能文章被改名了。</p>
  <p><a href="/index.html">← 回到文章列表</a></p>
</main>
</body>
</html>
