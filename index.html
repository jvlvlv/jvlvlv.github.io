<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>橘侣侣的个人小站</title>
<meta name="description" content="记录智能车竞赛的备赛、调车与比赛历程。">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="images/logo-64.png">
<script>
  // 在样式加载前定好深浅色，避免闪白
  (function () {
    try {
      var s = localStorage.getItem('theme');
      var t = s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <span data-site-name>智能车手记</span>
    </a>
    <nav class="nav">
      <a href="index.html" class="active">文章</a>
      <a href="about.html">关于</a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色">☾</button>
    </nav>
  </div>
</header>

<main id="main" class="wrap">
  <section class="hero">
    <h1><span data-site-name>智能车手记</span></h1>
    <p class="tagline" data-site-tagline>备赛、调车、翻车、再爬起来的全过程记录。</p>
    <div class="meta-strip" id="meta-strip"></div>
  </section>

  <div class="tag-bar" id="tag-bar"></div>
  <div class="post-list" id="post-list">
    <p class="loading">加载中</p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>© <span data-year>2026</span> <span data-author>你的名字</span></span>
    <span>用 Markdown 写 · 托管在 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></span>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-label="查看大图"><img alt=""></div>

<script src="assets/md.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
